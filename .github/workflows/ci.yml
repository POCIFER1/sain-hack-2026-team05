name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Check Python and shell syntax
        run: |
          test -f main.py
          test -f start.sh
          python -m py_compile main.py
          sh -n start.sh

      - name: Check server startup
        run: |
          PORT=8000 sh start.sh > /tmp/app.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -s -o /dev/null --max-time 2 \
              http://127.0.0.1:8000/; then
              echo "Server responds over HTTP"
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/app.log
              exit 1
            fi

            sleep 2
          done

          cat /tmp/app.log
          exit 1
