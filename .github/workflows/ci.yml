
name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check required files
        run: |
          test -f main.py
          test -f start.sh
          test -f hackathon_client.py
          test -f analytics.py
          test -f case3_contract.py
          test -f schemas/Case3Answers.schema.json

          test -f tests/test_hackathon_client.py
          test -f tests/test_case3_contract.py
          test -f tests/test_run.py

      - name: Check Python and shell syntax
        run: |
          python -m compileall -q \
            main.py \
            hackathon_client.py \
            analytics.py \
            case3_contract.py \
            tests

          sh -n start.sh

      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail

          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v 2>&1 | tee /tmp/backend-tests.log

          if ! grep -Eq \
            '^[[:space:]]*Ran [1-9][0-9]* tests? in ' \
            /tmp/backend-tests.log; then
            echo "::error::No backend tests were discovered"
            exit 1
          fi

      - name: Check server startup
        run: |
          set -euo pipefail

          PORT=8000 sh start.sh > /tmp/app.log 2>&1 &
          server_pid=$!

          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --output /dev/null \
              --max-time 2 \
              http://127.0.0.1:8000/health; then

              curl \
                --fail \
                --silent \
                --show-error \
                --output /dev/null \
                --max-time 2 \
                http://127.0.0.1:8000/

              echo "Backend startup and health checks passed"
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::Backend process terminated unexpectedly"
              cat /tmp/app.log
              exit 1
            fi

            sleep 2
          done

          echo "::error::Backend startup timeout"
          cat /tmp/app.log
          exit 1
